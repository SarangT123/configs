# -----------------------------------------------------
# PORTED HYPRLAND CONFIGURATION FROM SWAY
# -----------------------------------------------------

# --- MONITORS ---
# sway output * bg /home/sarang/Pictures/wallpapers/WALL3.JPG fill
# eDP-1 scale 1.0
monitor=eDP-1,preferred,auto,1.0
monitor=,preferred,auto,1

# --- AUTOSTART ---
exec-once = hyprpaper
# WALLPAPER=/home/sarang/Pictures/wallpapers/wall_ooty2.jpg
exec-once = command -v swaync >/dev/null 2>&1 && swaync
exec-once = waybar
exec-once = sh -c 'pkill wl-paste; wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store &'
exec-once = sh -c 'command -v swayidle >/dev/null 2>&1 && command -v swaylock >/dev/null 2>&1 && swayidle -w before-sleep "swaylock -f -i ~/.config/sway/wall2-blurred.jpg"'
exec-once = sh -c 'pkill -f battery_alert.sh; ~/.config/sway/battery_alert.sh &'
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = sh -c 'if command -v libinput-gestures-setup >/dev/null 2>&1; then libinput-gestures-setup stop >/dev/null 2>&1 || true; libinput-gestures-setup start; fi'
# Note: autotiling is not needed in Hyprland, it uses dwindle/master layout natively.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# --- ENVIRONMENT VARIABLES ---
env = GTK_THEME,Adwaita:dark

# --- VARIABLES ---
$mod = SUPER
$term = alacritty
$menu_toggle = sh -c 'if pgrep -x wofi >/dev/null 2>&1; then pkill -x wofi; elif pgrep -x rofi >/dev/null 2>&1; then pkill -x rofi; elif pgrep -x bemenu-run >/dev/null 2>&1; then pkill -x bemenu-run; elif pgrep -x bemenu >/dev/null 2>&1; then pkill -x bemenu; elif pgrep -x dmenu >/dev/null 2>&1; then pkill -x dmenu; else if command -v wofi >/dev/null 2>&1; then wofi --show drun --allow-images --insensitive; elif command -v rofi >/dev/null 2>&1; then rofi -show drun; elif command -v bemenu-run >/dev/null 2>&1; then bemenu-run; elif command -v dmenu >/dev/null 2>&1; then dmenu_run; fi; fi'

# --- INPUT ---
input {
    kb_layout = us
    
    # Mouse
    natural_scroll = false
    
    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.3
    }
}
# hide_cursor 3000 / hide_cursor when-typing
cursor {
    inactive_timeout = 3
    hide_on_key_press = true
}

# --- STYLING (SwayFX translation) ---
general {
    gaps_in = 2
    gaps_out = 0
    border_size = 2
    
    col.active_border = rgb(888888)
    col.inactive_border = rgb(333333)

    layout = dwindle # standard tiling layout
}

dwindle {
    # 0 = split follows mouse (default)
    # 1 = always split to the left/top
    # 2 = always split to the right/bottom
    force_split = 2
    preserve_split = true
}

decoration {
    rounding = 10
    
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0000007F)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
    }
    
    dim_inactive = true
    dim_strength = 0.1
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    # Window open animation twice as fast (default speed is 7, reduced to 3.5)
    animation = windows, 1, 3.5, myBezier
    animation = windowsOut, 1, 3.5, default, popin 80%
    
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    
    # Workspace change animation to a quick fade
    animation = workspaces, 1, 2, default, fade
}

# Layer rules (blur wofi)
layerrule {
    name = wofi
    blur = true
    ignore_alpha = true
}

# --- WINDOW RULES ---
windowrule = float on, move (cursor_x-window_w*0.5) (cursor_y+30), match:class ^(waybar-nmtui|org[.]pulseaudio[.]pavucontrol|blueman-manager)$
windowrule = size 700 500, match:class ^(nmtui|waybar-nmtui)$
windowrule = size 400 400, match:class ^(org[.]pulseaudio[.]pavucontrol|blueman-manager|waybar-bluetooth)$
windowrule = float on, center on, match:class ^(kitty)$
windowrule = float on, center on, match:workspace special
# --- KEYBINDS ---
# Apps
bind = $mod, Return, exec, $term
bind = $mod SHIFT, Q, killactive,
bind = ALT, space, exec, $menu_toggle
bind = $mod SHIFT, G, exec, sh -c 'if command -v heroic >/dev/null 2>&1; then heroic; elif command -v heroic-launcher >/dev/null 2>&1; then heroic-launcher; fi'
bind = $mod SHIFT, D, exec, wofi --show run
bind = $mod SHIFT, B, exec, zen-browser
bind = $mod SHIFT, F, exec, sh -c 'if command -v nautilus >/dev/null 2>&1; then nautilus; elif command -v thunar >/dev/null 2>&1; then thunar; elif command -v dolphin >/dev/null 2>&1; then dolphin; else xdg-open "$HOME"; fi'
bind = $mod, C, exec, code
bind = $mod SHIFT, M, exec, sh -c 'if command -v spotify >/dev/null 2>&1; then spotify; elif command -v spotify-launcher >/dev/null 2>&1; then spotify-launcher; fi'
bind = $mod SHIFT, W, exec, google-chrome-stable https://web.whatsapp.com
bind = CTRL SHIFT, Escape, exec, gnome-system-monitor
bind = $mod SHIFT, Escape, exec, alacritty -e htop
bind = $mod, D, exec, sh -c 'if command -v discord >/dev/null 2>&1; then discord; elif command -v vesktop >/dev/null 2>&1; then vesktop; fi'

# System Actions
bind = $mod SHIFT, L, exec, sh -c 'if command -v swaylock >/dev/null 2>&1; then swaylock -f -i ~/.config/sway/wall2-blurred.jpg; fi; systemctl suspend'
bind = $mod SHIFT, N, exec, sh -c 'command -v swaync-client >/dev/null 2>&1 && swaync-client -t -sw'
bind = , Print, exec, ~/.config/sway/screenshot.sh full
bind = SHIFT, Print, exec, ~/.config/sway/screenshot.sh area
bind = $mod, Print, exec, ~/.config/sway/screenshot.sh copy-full
bind = $mod SHIFT, Print, exec, ~/.config/sway/screenshot.sh copy-area
bind = $mod, KP_Enter, exec, code ~/.config/hypr/hyprland.conf
bind = $mod SHIFT, C, exec, ~/.config/hypr/reload_all.sh
bind = $mod SHIFT, P, exec, ~/.config/hypr/reload_wallpaper.sh
bind = $mod SHIFT, R, exec, ~/.config/hypr/cycle_wallpaper.sh
bind = $mod SHIFT, E, exec, ~/.config/sway/exit.sh
bind = $mod, V, exec, ~/.config/sway/cliphist.sh
bind = $mod, KP_Decimal, exec, if pkill -x wlsunset; then notify-send 'Eye Protection' 'Disabled'; else wlsunset -t 5000 -T 5001 -S 00:00 -s 00:00 & notify-send 'Eye Protection' 'Enabled'; fi

# Audio / Brightness (Media keys)
bindel = , XF86MonBrightnessDown, exec, sh -c 'if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set 5%-; elif command -v light >/dev/null 2>&1; then light -U 5; fi'
bindel = , XF86MonBrightnessUp, exec, sh -c 'if command -v brightnessctl >/dev/null 2>&1; then brightnessctl set +5%; elif command -v light >/dev/null 2>&1; then light -A 5; fi'
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Layout / Focus
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, space, exec, ~/.config/hypr/toggle_float_resize.sh
bind = $mod, space, exec, ~/.config/hypr/toggle_float_resize.sh

# Dwindle / Layout toggles (approximate of stacking/tabbed)
bind = $mod, S, layoutmsg, togglesplit # toggle horizontal/vertical split
bind = $mod, W, togglegroup, # grouped windows act like tabs
bind = $mod, E, pseudo, # pseudo tiling

# Focus Movement
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# Window Movement and Resizing with Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Window Movement
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod, Tab, workspace, m+1
bind = $mod SHIFT, Tab, workspace, m-1

# Move container to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad

# Resize submap
bind = $mod, R, submap, resize
submap = resize
binde = , Right, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Up, resizeactive, 0 -10
binde = , Down, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
