# WALLPAPER=/home/sarang/Pictures/wallpapers/wall2.jpg

monitor=eDP-1,preferred,auto,1.0
monitor=,preferred,auto,1

exec-once = swaybg -i "/home/sarang/Pictures/wallpapers/wall2.jpg" -m fill
exec-once = swaync
exec-once = waybar
exec-once = pkill wl-paste 2>/dev/null; wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store
exec-once = swayidle -w before-sleep "swaylock -f -i ~/.config/sway/wall2-blurred.jpg"
exec-once = ~/.config/sway/battery_alert.sh &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

$mod = SUPER

input {
    kb_layout = us
    touchpad {
        natural_scroll = true
        tap-to-click = true
        scroll_factor = 0.3
    }
}

cursor {
    inactive_timeout = 3
    hide_on_key_press = true
}

general {
    gaps_in = 2
    gaps_out = 0
    border_size = 2
    col.active_border = rgb(888888)
    col.inactive_border = rgb(333333)
    layout = dwindle
}

dwindle {
    force_split = 2
    preserve_split = true
}

decoration {
    rounding = 10
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(0000007F)
    }
    blur {
        enabled = true
        size = 5
        passes = 3
    }
    dim_inactive = true
    dim_strength = 0.1
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 3.5, myBezier
    animation = windowsOut, 1, 3.5, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 2, default, fade
}

layerrule {
    name = wofi
    blur = true
    ignore_alpha = true
}

windowrule = float on, move (cursor_x-window_w*0.5) (cursor_y+30), match:class ^(waybar-nmtui|org[.]pulseaudio[.]pavucontrol|blueman-manager)$
windowrule = size 700 500, match:class ^(nmtui|waybar-nmtui)$
windowrule = size 400 400, match:class ^(org[.]pulseaudio[.]pavucontrol|blueman-manager|waybar-bluetooth)$
windowrule = float on, center on, match:class ^(kitty)$
windowrule = float on, center on, match:workspace special

# Apps
bind = $mod, Return, exec, alacritty
bind = $mod SHIFT, Q, killactive
bind = $mod SHIFT, D, exec, wofi --show run
bind = $mod SHIFT, B, exec, zen-browser
bind = $mod SHIFT, F, exec, nautilus
bind = $mod, C, exec, code
bind = $mod SHIFT, M, exec, spotify
bind = ALT, space, exec, wofi --show drun
bind = $mod SHIFT, G, exec, heroic
bind = $mod SHIFT, W, exec, google-chrome-stable https://web.whatsapp.com
bind = CTRL SHIFT, Escape, exec, gnome-system-monitor
bind = $mod SHIFT, Escape, exec, alacritty -e htop
bind = $mod, D, exec, discord

# System
bind = $mod SHIFT, L, exec, swaylock -f -i ~/.config/sway/wall2-blurred.jpg; systemctl suspend
bind = $mod SHIFT, N, exec, swaync-client -t -sw
bind = , Print, exec, ~/.config/sway/screenshot.sh full
bind = SHIFT, Print, exec, ~/.config/sway/screenshot.sh area
bind = $mod, Print, exec, ~/.config/sway/screenshot.sh copy-full
bind = $mod SHIFT, Print, exec, ~/.config/sway/screenshot.sh copy-area
bind = $mod, KP_Enter, exec, code ~/.config/hypr/hyprland.conf
bind = $mod SHIFT, C, exec, ~/.config/hypr/reload_all.sh
bind = $mod SHIFT, P, exec, ~/.config/hypr/reload_wallpaper.sh
bind = $mod, N, exec, ~/.config/hypr/cycle_wallpaper.sh
bind = $mod SHIFT, E, exec, ~/.config/sway/exit.sh
bind = $mod, V, exec, ~/.config/sway/cliphist.sh
bind = $mod, KP_Decimal, exec, pkill -x wlsunset && notify-send 'Eye Protection Disabled' || (wlsunset -t 5000 -T 5001 -S 00:00 -s 00:00 & notify-send 'Eye Protection Enabled')

# Media keys
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

# Layout
bind = $mod, F, fullscreen
bind = $mod SHIFT, space, exec, ~/.config/hypr/toggle_float_resize.sh
bind = $mod, space, exec, ~/.config/hypr/toggle_float_resize.sh
bind = $mod, S, layoutmsg, togglesplit
bind = $mod, W, togglegroup
bind = $mod, E, pseudo

# Focus
bind = $mod, Left, movefocus, l
bind = $mod, Right, movefocus, r
bind = $mod, Up, movefocus, u
bind = $mod, Down, movefocus, d
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Windows
bind = $mod SHIFT, Left, movewindow, l
bind = $mod SHIFT, Right, movewindow, r
bind = $mod SHIFT, Up, movewindow, u
bind = $mod SHIFT, Down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, Tab, workspace, m+1
bind = $mod SHIFT, Tab, workspace, m-1
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10
bind = $mod SHIFT, minus, movetoworkspacesilent, special:scratchpad
bind = $mod, minus, togglespecialworkspace, scratchpad

# Resize
bind = $mod, R, submap, resize
submap = resize
binde = , Right, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Up, resizeactive, 0 -10
binde = , Down, resizeactive, 0 10
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset
